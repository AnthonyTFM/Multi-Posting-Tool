# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo.
# Secrets marked `sync: false` are asked for during setup.
services:
  - type: web
    name: omurice-ramen
    runtime: docker
    rootDir: omurice-ramen
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # persistent disk needs a paid plan (~$7/mo)
    region: ohio
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data # database + uploaded photos/videos
      sizeGB: 5
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false # e.g. https://omuriceramen.com
      - key: DATABASE_PATH
        value: /data/omurice.db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: STAFF_TRANSFER_NUMBER
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false # optional: automatic Google reviews
      - key: POS_PROVIDER
        value: none
